<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>87版《红楼梦》资料馆 · Dream of the Red Chamber 1987</title>
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#2b2b2b; --ink2:#6b6b6b;
  --line:#e8e2d8; --accent:#b03a2e; --accent2:#8a2f25; --gold:#b98a2f;
  --chip-core:#b03a2e; --chip-important:#b98a2f; --chip-entry:#7a7a7a; --chip-mentioned:#b5b5b5;
  --green:#2f6b3a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* 导航 */
nav{position:sticky;top:0;z-index:50;background:rgba(250,247,242,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.nav-in{display:flex;align-items:center;gap:3px;max-width:1180px;margin:0 auto;padding:6px 10px;overflow-x:auto;white-space:nowrap;flex-wrap:wrap;row-gap:4px}
.brand{font-weight:700;color:var(--accent2);font-size:13px;flex-shrink:0;margin-right:5px}
.brand small{display:block;font-weight:400;color:var(--ink2);font-size:8.5px;letter-spacing:.2px}
nav a.menu{color:var(--ink);font-size:12px;padding:3px 5px;border-radius:6px;flex-shrink:0}
nav a.menu:hover{background:#f0e9dd;text-decoration:none}
nav a.menu.on{background:var(--accent);color:#fff}
.langbtn{margin-left:auto;background:var(--accent2);color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;flex-shrink:0}
.langbtn:hover{background:#7a3a2c}

/* 通用 */
h1{font-size:30px;margin:8px 0 4px;letter-spacing:1px}
h2{font-size:22px;margin:28px 0 12px;color:var(--accent2);border-left:4px solid var(--accent);padding-left:10px}
h3{font-size:16px;margin:14px 0 6px}
.sub{color:var(--ink2);font-size:13px;margin-bottom:18px}
.en{font-family:Georgia,"Times New Roman",serif;color:var(--ink2);font-size:13px;letter-spacing:.3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.muted{color:var(--ink2)}
.small{font-size:12.5px;color:var(--ink2)}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;color:#fff;margin-right:6px}
.t-core{background:var(--chip-core)}.t-important{background:var(--chip-important)}
.t-entry{background:var(--chip-entry)}.t-mentioned{background:var(--chip-mentioned)}
.btn{display:inline-block;padding:8px 16px;border-radius:8px;background:var(--accent);color:#fff;font-size:14px;border:none;cursor:pointer}
.btn:hover{background:var(--accent2);text-decoration:none}
.back{font-size:13px;margin-bottom:8px;display:inline-block}

/* 首页 */
.hero{background:linear-gradient(160deg,#3a2b25 0%,#6b4a3a 100%);color:#f5eee4;border-radius:14px;padding:44px 40px;margin:24px 0 20px;position:relative;overflow:hidden}
.hero h1{font-size:36px;color:#fff;letter-spacing:4px;margin:0 0 6px}
.hero .en{color:#d9c9b8;font-size:15px;letter-spacing:1px}
.hero p.zh{margin-top:12px;color:#efe4d6;font-size:15px;max-width:760px}
.hero p.en2{margin-top:10px;color:#cbb9a5;font-size:13px;max-width:760px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;text-align:center;padding:18px 10px}
.stat b{font-size:30px;color:var(--accent2);display:block;line-height:1.2}
.stat span{font-size:12.5px;color:var(--ink2)}
.gates{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:8px}
.gate{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 14px;transition:.15s}
.gate:hover{transform:translateY(-2px);border-color:var(--accent);text-decoration:none}
.gate b{display:block;font-size:15px;color:var(--ink)}
.gate small{color:var(--ink2);font-size:12px}

/* 图鉴 */
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.controls input,.controls select{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px}
.controls input{flex:1;min-width:220px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 14px;font-size:13px;cursor:pointer;color:var(--ink2)}
.chips button.on{border-color:var(--accent);color:var(--accent2);background:#f7ece7}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;transition:.15s;display:flex;gap:12px;align-items:flex-start}
.pcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.pcard .pt{width:52px;height:68px;object-fit:cover;border-radius:6px;flex-shrink:0;background:#efe9dd}
.pcard .ptx{flex:1;min-width:0}
.pcard b{font-size:16px}
.pcard .actor{font-size:13px;color:var(--ink2);margin:2px 0 6px}
.pcard .rel{font-size:12px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.phflag{font-size:11px;margin-top:4px}
.phflag.has{color:var(--green)}
.phflag.no{color:#a89b8b}
.photos-mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:6px}
.photos-mini img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;background:#efe9dd}
.photos-mini figcaption{font-size:11.5px;color:var(--ink2);margin-top:4px;line-height:1.5}
.ph-filter{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ph-filter input{flex:1;min-width:220px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px}
.ph-filter select{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px}

/* 表格 */
table{width:100%;border-collapse:collapse;background:#fff;font-size:13.5px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:#f3ede2;font-weight:600;white-space:nowrap}
tr:nth-child(even) td{background:#fbf8f2}

/* 分集 */
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ep{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.ep b{color:var(--accent2);display:block}
.ep p{font-size:13px;color:var(--ink);margin-top:6px;display:none;white-space:normal;overflow-wrap:break-word;word-break:break-word}
.ep.open p{display:block}
.ep button{display:block;margin-top:8px;background:none;border:none;color:var(--accent2);font-size:12.5px;cursor:pointer;padding:0}

/* 时间线 */
.tl{position:relative;margin-left:12px;padding-left:26px;border-left:2px solid var(--line)}
.tl .item{position:relative;margin-bottom:20px}
.tl .item::before{content:"";position:absolute;left:-33px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl .year{font-weight:700;color:var(--accent2);font-size:15px}
.tl .txt{font-size:14px;margin-top:2px}

/* 音乐 */
.music-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.mtrack{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.mtrack .no{color:var(--gold);font-weight:700;font-size:13px}
.mtrack b{font-size:15px;margin-left:4px}
.lyr-btn{margin-top:8px;background:none;border:none;color:var(--accent2);font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline}
.lyrics{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.lyrics.open{display:block}
.lyrics p{margin:3px 0;font-size:13px;line-height:1.65}

/* 轶闻状态 */
.st{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:12px;margin-left:6px;vertical-align:2px}
.st-ok{background:#e6efe6;color:#2f6b3a}.st-part{background:#f6ecd9;color:#8a6a1f}

/* 关系图 */
.fig-scroll{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
.fig-note{font-size:12px;color:var(--ink2);margin-top:6px}

/* 图库 */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.photo{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.photo img{width:100%;display:block;aspect-ratio:4/5;object-fit:cover;background:#f1ece2}
.photo .cap{padding:10px 12px;font-size:13px}
.photo .cap b{font-size:14px}
.photo .cap .src{font-size:11.5px;color:var(--ink2);margin-top:4px;word-break:break-all}

footer{border-top:1px solid var(--line);margin-top:40px;padding:22px 0 40px;color:var(--ink2);font-size:12.5px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

.jinling-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;margin-bottom:22px}
.jcard blockquote.poem{border-left:3px solid #b98a2f;margin:10px 0;padding:8px 12px;background:#faf5ee;font-size:15px;line-height:1.9;color:#4a3f33}
.jcard .song{white-space:pre-wrap;line-height:1.75;margin:8px 0}

/* 人物详情页内的深度故事区块（沿用主站浅色主题，无独立页面 / 无标签页） */
.book-lead{background:#faf5ee;border-left:4px solid var(--accent);padding:14px 18px;border-radius:0 8px 8px 0;font-size:14px;line-height:1.9;margin-bottom:18px}
.srcbox{font-size:12px;color:var(--ink2);border-top:1px dashed var(--line);margin-top:10px;padding-top:7px}
.srcbox b{color:var(--accent2);margin-right:6px;font-weight:600}
.chap{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.chap h3{margin:0 0 8px;color:var(--accent2)}
.chap p{font-size:14px;line-height:1.85}
.chap .chap-no{display:inline-block;background:#f3ede2;border-radius:6px;padding:1px 9px;font-size:12px;color:var(--ink2);margin-right:8px}
.chap .chap-tag{font-size:12px;color:var(--gold)}
.chap .q{border-left:3px solid var(--gold);background:#faf5ee;padding:8px 12px;margin-top:10px;font-size:14px;color:#4a3f33}
.poemline{font-family:Georgia,"Songti SC","SimSun",serif;font-size:15px;line-height:2;color:#4a3f33}
.book-poems{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px}
.book-poems .card{margin:0}
@media(max-width:720px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .hero{padding:30px 22px}
  .hero h1{font-size:28px}
}
</style>
</head>
<body>

<nav>
  <div class="nav-in">
    <div class="brand" id="brandZh">87版《红楼梦》资料馆<small>Dream of the Red Chamber · 1987</small></div>

</nav>

<main id="app" class="wrap"></main>

<footer>
  <div class="wrap">
    <div>87版《红楼梦》资料馆 · <span id="ftZh">本地静态资料站（仅本地展示，不发布线上）</span><span id="ftEn" style="display:none">Local static archive · for local viewing only</span></div>
    <div><span id="fvZh">数据版本 v2.4 · 更新 2026-11-12 · 出处见「信源·勘误」</span><span id="fvEn" style="display:none">Data v2.4 · updated 2026-11-12 · sources in "Sources"</span></div>
  </div>
</footer>

<script src="data/characters.js?v=1.5"></script>
<script src="data/episodes.js?v=1.5"></script>
<script src="data/timeline.js?v=1.5"></script>
<script src="data/music.js?v=1.5"></script>
<script src="data/content.js?v=1.5"></script>
<script src="data/profiles.js?v=1.5"></script>
<script src="data/photos.js?v=1.5"></script>
<script src="data/photos-nverce.js?v=2.1"></script>
<script src="data/photos-web.js?v=2.2"></script>
<script src="data/photos-book.js?v=2.4"></script>
<script src="data/jinling.js?v=1.5"></script>
<!-- 21 册人物深度资料：已并入人物图鉴，与主站数据同在 data/，不再有独立子站 -->
<script src="data/books-content.js?v=2.1"></script>
<script src="data/people-extra.js?v=2.1"></script>
<script src="data/memoir.js?v=2.4"></script>
<script src="data/bridge.js?v=2.1"></script>
<script>
var H = window.HLM87;
/* 图库合并：资料馆原图库 + 女儿册专采 + 网络补采 + 书籍影像，
   全部落在 assets/photos/ 单一目录。webPhotos 由 scripts/fetch_web_photos.py 生成，
   bookPhotos 由 scripts/import_book_photos.py 生成（回忆录插图 + 纪念画册扫描页）。 */
if(H.photos && !H.photos._merged){
  H.photos.items = (H.photos.items||[]).concat(H.extraPhotos||[], H.webPhotos||[], H.bookPhotos||[]);
  H.photos._merged = true;
}
/* 回忆录一手材料并入各人物册已有的「幕后细节」「她说」，不新增板块或页面；
   MEMOIR 由 scripts/memoir_to_stories.py 从欧阳奋强 2017 年回忆录文字版生成。 */
if(window.MEMOIR && window.BOOKS && !window._memoirMerged){
  Object.keys(window.MEMOIR).forEach(function(id){
    var B = window.BOOKS[id], M = window.MEMOIR[id];
    if(!B || !M) return;
    B.behind = (B.behind||[]).concat(M.behind||[]);
    B.quotes = (B.quotes||[]).concat(M.quotes||[]);
  });
  window._memoirMerged = true;
}
/* 按渠道统计，供图库筛选与全站数字展示动态取用，不再硬编码张数 */
var ORIGIN_COUNT = {};
(H.photos.items||[]).forEach(function(p){ var k=p.origin||"资料馆原图库"; ORIGIN_COUNT[k]=(ORIGIN_COUNT[k]||0)+1; });
var ORIGIN_LABEL = {
  "资料馆原图库": ["资料馆原图库", "Archive originals"],
  "女儿册采集": ["女儿册专采", "Portrait collection"],
  "微信公众号图文": ["微信公众号图文", "WeChat articles"],
  "公开图文页": ["公开图文页", "Public articles"],
  "公开图片检索": ["公开图片检索", "Image search"],
  "回忆录插图": ["回忆录插图", "Memoir illustrations"],
  "纪念画册扫描": ["纪念画册扫描", "Photo album scans"]
};
/* 女儿册信源表中的站内相对链接在主站下需改为本地 hash 路由 */
var REF = window.REF || {};
Object.keys(REF).forEach(function(k){
  if(REF[k] && REF[k].url) REF[k].url = REF[k].url.replace("../index.html","");
});
var BOOKS = window.BOOKS || {}, PEOPLE = window.PEOPLE || {}, NV = window.NVERCE || {},
    CHAR2ID = window.CHAR2ID || {}, SOURCES = window.SOURCES || [], NOTES = window.NOTES || [];
var lang = "zh";
function L(zh, en){ return lang === "en" ? en : zh; }
var STATUS = {core:"核心人物", important:"重要人物", entry:"一般人物", mentioned:"仅提及（原著提及，87版未出场/资料暂缺）"};
var STATUS_EN = {core:"Core", important:"Major", entry:"Regular", mentioned:"Mentioned only"};
function statusLabel(k){ return L(STATUS[k] ? STATUS[k].split("（")[0] : k, STATUS_EN[k] || k); }
function toggleLang(){
  lang = lang === "zh" ? "en" : "zh";
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.getElementById("langbtn").textContent = lang === "zh" ? "EN" : "中文";
  ["ftZh","fvZh"].forEach(function(id){ var el=document.getElementById(id); if(el) el.style.display = lang === "zh" ? "" : "none"; });
  ["ftEn","fvEn"].forEach(function(id){ var el=document.getElementById(id); if(el) el.style.display = lang === "en" ? "" : "none"; });
  document.querySelectorAll("nav a.menu").forEach(function(a){
    a.textContent = a.getAttribute(lang === "zh" ? "data-zh" : "data-en");
  });
  render();
}
var GROUPS = []; (H.characters||[]).forEach(function(c){ if(GROUPS.indexOf(c.group)<0) GROUPS.push(c.group); });
var listState = {q:"", group:"全部", status:"全部", book:"全部"};
var photoState = {q:"", kind:"全部", origin:"全部", limit:120};
/* 图片索引：char -> photos[]。合影的 char 为「王熙凤、平儿」形式，拆开后
   同一张图会同时出现在多位人物页，但图库里仍只算一张。 */
var photosIndex = {};
(H.photos.items||[]).forEach(function(p){
  String(p.char||"").split(/[、,，]/).forEach(function(n){
    n=n.trim(); if(!n) return;
    if(!photosIndex[n]) photosIndex[n]=[];
    photosIndex[n].push(p);
  });
});
function photoByChar(name){ var a=photosIndex[name]; return a&&a.length?a[0]:null; }
function photosOf(name){ return photosIndex[name]||[]; }
function photoAll(name){ return photosIndex[name]||[]; }

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function $(id){ return document.getElementById(id); }

/* ---------------- 路由 ---------------- */
function render(){
  var h = location.hash || "#/";
  var parts = h.replace(/^#\/?/,"").split("/");
  var v = parts[0] || "home";
  var el = $("app");
  document.querySelectorAll("nav a.menu").forEach(function(a){
    a.classList.toggle("on", a.dataset.v === (v === "book" ? "list" : v));
  });
  switch(v){
    case "home": el.innerHTML = viewHome(); break;
    case "list": el.innerHTML = viewList(); break;
    case "book": { // 旧册页地址仅作兼容：直接渲染对应人物详情，不再有独立册页
      var bid=decodeURIComponent(parts[1]||""), bb=BOOKS[bid];
      el.innerHTML = viewChar(bb&&bb.name?bb.name:bid);
      break;
    }
    case "char": el.innerHTML = viewChar(decodeURIComponent(parts[1]||"")); break;
    case "episodes": el.innerHTML = viewEpisodes(); break;
    case "relations": el.innerHTML = viewRelations(); break;
    case "timeline": el.innerHTML = viewTimeline(); break;
    case "music": el.innerHTML = viewMusic(); break;
    case "behind":
    case "gossip":
    case "crew": el.innerHTML = viewBehindAll(); break;
    case "memorial": el.innerHTML = viewMemorial(); break;
    case "compare": el.innerHTML = viewCompare(); break;
    case "sources": el.innerHTML = viewSources(); break;
    case "photos": el.innerHTML = viewPhotos(); break;
    default: el.innerHTML = viewHome();
  }
  window.scrollTo(0,0);
  if(v==="list") initList();
  if(v==="photos") initPhotos();
}
window.addEventListener("hashchange", render);

/* ---------------- 首页 ---------------- */
function viewHome(){
  return ''+
  '<section class="hero">'+
    '<h1>'+L("87版《红楼梦》","Dream of the Red Chamber · 1987")+'</h1>'+
    (lang==="zh"

/* ---------------- 人物图鉴（含「女儿册」人物册） ---------------- */
function volNum(s){
  var cn={"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
  var t=String(s||"").replace(/^第/,"").replace(/册$/,"");
  if(/^\d+$/.test(t)) return Number(t);
  if(t==="十") return 10;
  var a=t.split("十");
  if(a.length===2) return (a[0]?cn[a[0]]||1:1)*10+(a[1]?cn[a[1]]||0:0);
  return cn[t]||99;
}
function bookletList(){
  return (PEOPLE||[]).filter(function(p){ return p.status === "done" && p.id && BOOKS[p.id]; })
    .sort(function(a,b){ return volNum(BOOKS[a.id].volume)-volNum(BOOKS[b.id].volume); });
}
function viewList(){
  var done = bookletList();
  return ''+

    '<select id="lb"><option value="全部" '+(listState.book==="全部"?'selected':'')+'>'+L("全部人物","All entries")+'</option>'+
      '<option value="has" '+(listState.book==="has"?'selected':'')+'>'+L("女儿册人物（"+done.length+"）","In-depth profiles ("+done.length+")")+'</option></select>'+
  '</div>'+

function initList(){
  var q=$("lq"), g=$("lg"), s=$("ls"), b=$("lb");
  q.addEventListener("input", function(){ listState.q=q.value; drawList(); });
  g.addEventListener("change", function(){ listState.group=g.value; drawList(); });
  s.addEventListener("change", function(){ listState.status=s.value; drawList(); });
  b.addEventListener("change", function(){ listState.book=b.value; drawList(); });
  drawList();
}
function drawList(){
  var st=listState, out=[], q=st.q.trim().toLowerCase();
  H.characters.forEach(function(c){
    if(st.group!=="全部" && c.group!==st.group) return;
    if(st.status!=="全部" && c.status!==st.status) return;
    var nv = (NV.people||{})[c.name];
    if(st.book==="has" && !nv) return;
    if(q){
      var hay=(c.name+" "+(c.aliases||"")+" "+(c.actor||"")+" "+(c.relation||"")).toLowerCase();
      if(hay.indexOf(q)<0) return;
    }
    out.push(c);
  });
  var order={core:0,important:1,entry:2,mentioned:3};
  out.sort(function(a,b){ return ((order[a.status]!==undefined?order[a.status]:4))-((order[b.status]!==undefined?order[b.status]:4)) || a.name.localeCompare(b.name,"zh"); });
  var html='<p class="small muted">'+out.length+' '+L("条结果","results")+'</p><div class="people">';
  out.forEach(function(c){
    var ph=photoByChar(c.name);
    var phs=photosOf(c.name);
    var nv=(NV.people||{})[c.name];
    var img=ph?'<img class="pt" src="assets/photos/'+(ph.thumb||ph.file)+'" alt="'+esc(c.name)+L("影像","photo")+'" loading="lazy">':'';
    var imgTag=phs&&phs.length>0?L('影像 '+phs.length+' 张','Photos: '+phs.length):L('暂无影像','No photo yet');
    html+='<a class="pcard" href="#/char/'+encodeURIComponent(c.name)+'">'+img+'<div class="ptx">'+
      '<b>'+esc(c.name)+'</b> <span class="tag t-'+c.status+'">'+statusLabel(c.status)+'</span>'+
      '<div class="actor">'+esc(c.actor||"—")+'</div>'+
      '<div class="rel">'+esc(c.relation||"")+'</div>'+
      '<div class="phflag '+(phs&&phs.length?'has':'no')+'">'+imgTag+(nv?' · '+L('故事 '+nv.stories+' 则','Stories '+nv.stories):'')+'</div>'+
    '</div></a>';
  });
  html+='</div>';
  $("lres").innerHTML = html;
}

function refLink(k){
  var r = typeof k === "string" ? REF[k] : k;

  var inner = r.url.charAt(0) === "#" ? "" : ' target="_blank" rel="noopener"';
  return '<a href="'+esc(r.url)+'"'+inner+'>'+esc(r.name)+' ↗</a>';
}
function srcLine(it){
  if(!it) return "";

function verdictOf(name){

  return '<h1>'+L("图库","Gallery")+'</h1>'+
  '<div class="card" style="background:#fbf4ee;border-color:#e8d8c8"><p class="small">'+esc(H.photos.note)+'</p>'+
  '<p class="small" style="margin-top:6px"><b>'+L("已合并","Merged")+'</b>：'+L("全站 "+H.photos.items.length+" 张图片统一存放于 assets/photos/："+nBase+" 张资料馆原有采集、"+nNv+" 帧林黛玉 / 陈晓旭专题采集，另有 "+nWeb+" 张本轮网络补采与 "+nBook+" 张书籍影像（欧阳奋强回忆录插图 + 李耀宗纪念画册扫描页，逐张标注书名、章节或页码与原书图注）。补采来源含微信公众号图文（欧阳宝玉／欧阳奋强、DJ雅清、高原羚羊、红楼轶事、红楼图志等）、公开图文页（澎湃、羊城晚报、新浪图片、网易、腾讯搜一搜、搜狐挂历与杂志、新民晚报等）与定向图片检索（Bing + 360 图片检索及其分页接口，含经典场景、挂历、扑克牌、赴港旧照、服装与化妆设计手稿等主题）。每张图均保留原文页面链接、出处公众号／站点、文章标题、采集日期与原始图片地址；画册整页扫描不强行归属具体人物，一律标「剧组 · 花絮」。人物归属依据原文逐图配文或检索关键词，未逐张人工核对，卡片上均标明归属方式；如有出入以原文页面为准。",
    H.photos.items.length+" images now share one folder: "+nBase+" archive originals, "+nNv+" Lin Daiyu portraits, "+nWeb+" collected web images (WeChat articles, public galleries, targeted image search) and "+nBook+" book images (memoir illustrations + commemorative album scans, each citing the book and chapter/page). Every item keeps its source page, publisher, article title, collection date and original image URL. Character attribution is inferred from original captions or search keywords, shown on each card and not verified photo by photo; full album pages and unattributable shots are marked \"Crew / candid\".")+'</p></div>'+
  '<div class="ph-filter">'+
    '<input id="pq" placeholder="'+L("搜索角色名 / 演员名 / 描述 / 来源…","Search character / actor / description / source…")+'" value="'+esc(photoState.q)+'">'+
    '<select id="pk">'+sel+'</select>'+
    '<select id="po">'+osel+'</select>'+
  '</div>'+
  '<div id="pres"></div>';
}
function initPhotos(){
  var q=$("pq"), k=$("pk"), o=$("po");
  q.addEventListener("input", function(){ photoState.q=q.value; photoState.limit=120; drawPhotos(); });
  k.addEventListener("change", function(){ photoState.kind=k.value; photoState.limit=120; drawPhotos(); });
  o.addEventListener("change", function(){ photoState.origin=o.value; photoState.limit=120; drawPhotos(); });
  drawPhotos();
}
function morePhotos(){ photoState.limit += 120; drawPhotos(); }
function drawPhotos(){
  var st=photoState, q=st.q.trim().toLowerCase(), out=[];
  H.photos.items.forEach(function(p){
    if(st.kind!=="全部" && p.kind!==st.kind) return;
    if(st.origin!=="全部" && (p.origin||"资料馆原图库")!==st.origin) return;
    if(q && (p.char+" "+(p.actor||"")+" "+p.desc+" "+(p.host||"")+" "+(p.cat||"")+" "+(p.title||"")+" "+(p.caption||"")+" "+(p.origin||"")).toLowerCase().indexOf(q)<0) return;
    out.push(p);
  });
  // 排序与人物图鉴一致：status 层级(core→important→entry→mentioned) + 中文名排序；
  // 「剧组」等多人合影无 characters 对应，一律排在最后。
  var order={core:0,important:1,entry:2,mentioned:3};
  var stOf={}; H.characters.forEach(function(c){ stOf[c.name]=c.status; });
  out.sort(function(a,b){
    var sa=(stOf[a.char]!==undefined?order[stOf[a.char]]:4), sb=(stOf[b.char]!==undefined?order[stOf[b.char]]:4);
    return sa-sb || a.char.localeCompare(b.char,"zh") || a.kind.localeCompare(b.kind) || a.id.localeCompare(b.id);
  });
  var shown=out.slice(0, st.limit);
  var html='<p class="small muted">'+out.length+' '+L("张（当前显示 ","photos (showing ")+shown.length+L(" 张）"," shown)")+'</p><div class="photos">';
  if(!out.length) html+='<div class="card"><p class="muted">'+L("暂无匹配图片，试试更换关键词或来源筛选。","No matching photos — try another keyword or source filter.")+'</p></div>';
  shown.forEach(function(p){
    html+='<div class="photo"><a href="assets/photos/'+p.file+'" target="_blank" rel="noopener" title="'+L("点击查看原图","Open original")+'"><img src="assets/photos/'+(p.thumb||p.file)+'" alt="'+esc(p.desc)+'" loading="lazy"></a>'+
    '<div class="cap"><b>'+esc(p.char)+'</b> · <span class="muted">'+esc(p.actor||"")+'</span> <span class="tag t-entry">'+kindLabel(p.kind)+'</span>'+
      (p.origin?'<span class="tag t-important">'+esc(p.origin)+'</span>':'')+ (p.cat?'<div class="small muted">'+esc(p.cat)+'</div>':'')+
    '<div class="small">'+esc(p.desc)+'</div>'+
    '<div class="src">'+L("来源：","Source: ")+esc(p.host)+'<br>'+
      (p.srcUrl?'<a href="'+esc(p.srcUrl)+'" target="_blank" rel="noopener">'+L("查看出处 ↗","Original page ↗")+'</a> · ':'')+
      L("采集：","Collected: ")+esc(p.date)+
      (p.attribution?'<br><span class="muted">'+L("人物归属：","Attribution: ")+esc(p.attribution)+'</span>':'')+
      '</div></div></div>';
  });
  html+='</div>';
  if(out.length>shown.length){
    html+='<p class="small" style="margin-top:14px"><a class="btn" href="#/photos" onclick="morePhotos();return false">'+
      L("再显示 120 张（还有 "+(out.length-shown.length)+" 张）→","Show 120 more ("+(out.length-shown.length)+" remaining) →")+'</a></p>';
  }
  $("pres").innerHTML=html;
}

/* 页脚张数按实际图库动态生成，避免每轮补采后留下的硬编码数字过期 */
(function(){
  var n=(H.photos.items||[]).length, b=(H.bookPhotos||[]).length;
  var zh=$("fvZh"), en=$("fvEn");
  if(zh) zh.textContent="数据版本 v2.4 · 更新 2026-11-12 · 图库 "+n+" 张（含书籍影像 "+b+" 张）· 19 册补入回忆录一手材料 · 出处见「信源·勘误」";
  if(en) en.textContent="Data v2.4 · updated 2026-11-12 · "+n+" gallery photos ("+b+" from books) · 19 profiles with memoir material · sources in \"Sources\"";
})();

render();
</script>
</body>
